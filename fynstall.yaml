# terrariabonker's installer, which fynstall (github.com/ushineko/fynstall)
# builds from this file: one self-contained program per platform that installs
# both binaries and needs no toolchain (spec 053).
#
#   make installer        builds both binaries, then the installers, into dist/
#
# One file for Linux and Windows. There is no `targets` key, so a build is for
# the machine that runs it: the window needs cgo, and is built where it runs.
app:
  id: io.ushineko.terrariabonker
  name: TerrariaBonker
  # .tag's, without the v. A test holds the two together (internal/buildinfo).
  version: 0.45.2
  publisher: ushineko
  icon: assets/terrariabonker.png

install:
  # Per-user: no administrator needed. The install and everything it writes
  # stay under the user's own profile.
  scopes: [user]
  dir:
    user: "{programs}/{id}"

payload:
  # The CLI does the work; the window is a front end that runs it. They are
  # installed side by side, and the window drives the CLI beside it.
  #
  # In bin/, not beside the uninstaller: the directory of a program on PATH
  # goes on PATH on Windows, and a program named "uninstall" does not belong
  # there.
  - src: bin/terrariabonker{exe}
    dst: bin/terrariabonker{exe}
  - src: bin/terrariabonker-gui{exe}
    dst: bin/terrariabonker-gui{exe}
  - src: README.md
    dst: share/doc/README.md

ui:
  # The finish page offers to start the window.
  launch: bin/terrariabonker-gui{exe}

integration:
  # Both by name from a terminal: `terrariabonker status`, `terrariabonker-gui`.
  path_links:
    - bin/terrariabonker{exe}
    - bin/terrariabonker-gui{exe}
  desktop:
    # The entry's ID is the app ID, by default: the window sets it as its
    # Wayland app_id, and a compositor finds the window's icon through the
    # entry of that name.
    - name: TerrariaBonker
      generic_name: Terraria trainer
      comment: Live-memory trainer and item editor for Terraria
      exec: bin/terrariabonker-gui{exe}
      # One main category: two can put the entry in the menu twice.
      categories: [Game]
      keywords: [terraria, trainer, godmode, cheat, memory, item, editor]
      startup_notify: true
  # The saved cheats, item edits and window settings are the person's, and
  # outlive an uninstall and an upgrade.
  keep_on_uninstall:
    - "{config}/terrariabonker"
