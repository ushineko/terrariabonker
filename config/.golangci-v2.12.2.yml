version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - unconvert
    - wrapcheck
  settings:
    gosec:
      # G304 (file inclusion via variable) is inherent to a tool whose sprite
      # extractor, profile store and content loader read user-nominated paths; it
      # is excluded rather than suppressed at every call site.
      excludes:
        - G304
    wrapcheck:
      # Errors crossing between this module's own packages carry their context
      # already; wrapping them again produces messages like "open store: open
      # store: ...". wrapcheck stays on for genuinely external errors, which is
      # where the missing context actually hurts.
      ignore-package-globs:
        - github.com/ushineko/terrariabonker/*
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
        - .Wrap(
        - .Wrapf(
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - wrapcheck
          # A fixture's Read and Write are reached through an interface, so
          # `unused` calls them dead -- and deleting one silently stops a
          # planted game mining, which is a passing test that proves nothing.
          # It happened.
          - unused

formatters:
  enable:
    - gofmt
    - goimports
